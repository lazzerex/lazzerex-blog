name: Scheduled blog rebuild

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Trigger Vercel deploy
        run: curl --fail --silent --show-error -X POST ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
