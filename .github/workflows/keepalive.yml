name: Keep Render service alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service health endpoint
        run: |
          curl --silent https://lazzerex-blog-web-service.onrender.com/health || true
          sleep 60
          curl --fail --silent --show-error https://lazzerex-blog-web-service.onrender.com/health
